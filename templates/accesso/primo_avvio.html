{% extends 'accesso/_pagina.html' %}{% block titolo %}Primo avvio{% endblock %}{% block corpo %}
  <p><b>Primo avvio.</b> Crea l'amministratore del programma: potrà poi creare gli utenti per reception, revenue e governante.</p>
  {% if errore %}<div class="banner err">{{ errore }}</div>{% endif %}
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Nome e cognome</label><input name="nome" style="width:100%" value="{{ request.form.nome or '' }}">
  <label>Nome utente</label><input name="username" autocomplete="username" autocapitalize="none" style="width:100%" required value="{{ request.form.username or '' }}">
  <label>Password (almeno 8 caratteri)</label><input type="password" name="password" autocomplete="new-password" style="width:100%" required>
  <label>Ripeti la password</label><input type="password" name="password2" autocomplete="new-password" style="width:100%" required>
  <p><button type="submit" style="width:100%">Crea l'amministratore</button></p>
{% endblock %}

{% extends 'base.html' %}{% block titolo %}Cambia password — Master Hospitality{% endblock %}{% block corpo %}
<h1>Cambia la tua password</h1>
<form class="card" method="post" style="max-width:420px">
  {% if errore %}<div class="banner err">{{ errore }}</div>{% endif %}
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Password attuale</label><input type="password" name="attuale" autocomplete="current-password" style="width:100%" required>
  <label>Nuova password (almeno 8 caratteri)</label><input type="password" name="nuova" autocomplete="new-password" style="width:100%" required>
  <label>Ripeti la nuova password</label><input type="password" name="nuova2" autocomplete="new-password" style="width:100%" required>
  <p><button type="submit">Salva</button></p>
</form>
{% endblock %}
